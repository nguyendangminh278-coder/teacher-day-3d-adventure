name: Build and publish continuous 3D game

on:
  push:
    branches: ["main"]
    paths:
      - "index.html"
      - "src/**"
      - "ASSET_CREDITS.md"
      - ".github/workflows/vendor-three.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish-continuous-3d
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          path: source

      - name: Checkout published branch
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: site
          fetch-depth: 0

      - name: Install local 3D build dependencies
        working-directory: source
        run: npm install --no-save --no-package-lock three@0.168.0 esbuild@0.24.0

      - name: Prepare clean published site
        run: |
          find site -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          mkdir -p site/src site/dist site/assets/models
          cp source/index.html site/index.html
          cp source/src/styles.css site/src/styles.css
          cp source/ASSET_CREDITS.md site/ASSET_CREDITS.md
          touch site/.nojekyll

      - name: Bundle Three.js, GLTFLoader and game code into one local file
        working-directory: source
        run: npx esbuild src/main.js --bundle --minify --format=iife --platform=browser --target=es2020 --outfile=../site/dist/game.min.js

      - name: Download CC0 game-ready example models into the site
        run: |
          curl -L --fail --retry 3 "https://raw.githubusercontent.com/agentkaerf/FreeModels/main/Cute%20Animated%20Monsters%20-%20Aug%202020/glTF/Panda.gltf" -o site/assets/models/mascot.gltf
          curl -L --fail --retry 3 "https://raw.githubusercontent.com/Hidencod/tge-assets/main/packs/car-kit/sedan.glb" -o site/assets/models/sedan.glb
          test -s site/assets/models/mascot.gltf
          test -s site/assets/models/sedan.glb
          test -s site/dist/game.min.js

      - name: Publish gh-pages
        working-directory: site
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to publish"
          else
            git commit -m "feat: continuous third-person 3D journey"
            git push origin HEAD:gh-pages
          fi
