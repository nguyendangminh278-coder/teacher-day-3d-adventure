name: Build and publish personalized 3D game

on:
  push:
    branches: ["main"]
    paths:
      - "index.html"
      - "src/**"
      - "tools/**"
      - "docs/**"
      - "ASSET_CREDITS.md"
      - ".github/workflows/vendor-three.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish-personalized-3d
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          path: source

      - name: Checkout published branch with existing CC0 assets
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: site
          fetch-depth: 0

      - name: Install local web build dependencies
        working-directory: source
        run: npm install --no-save --no-package-lock three@0.168.0 esbuild@0.24.0 @gltf-transform/cli@4.2.1

      - name: Run route and collider QA
        working-directory: source
        run: node tools/qa_routes.mjs

      - name: Verify existing local game assets
        run: |
          test -s site/assets/models/teacher_mom_chibi.glb
          test -s site/assets/models/sedan.glb
          test -s site/assets/models/v11/quaternius/tree_common.glb
          test -s site/assets/models/v11/quaternius/tree_twisted.glb
          test -s site/assets/models/v11/quaternius/birch.glb
          test -s site/assets/models/v11/quaternius/bush_flowers.glb
          test -s site/assets/models/v11/quaternius/bush_ultimate.glb
          test -s site/assets/models/v11/quaternius/fern.glb
          test -s site/assets/models/v11/quaternius/flower_pink.glb
          test -s site/assets/models/v11/quaternius/rock.glb
          test -s site/assets/models/v11/kenney/bench.glb

      - name: Fetch V16 photoreal CC0 assets from Poly Haven
        working-directory: source
        run: |
          python3 tools/fetch_photoreal_v16.py ../site
          test -s ../site/assets/v16/hdri/cloud_layers_2k.hdr
          test -s ../site/assets/v16/materials/forest_floor/basecolor.jpg
          test -s ../site/assets/v16/materials/wood_floor/basecolor.jpg
          test -s ../site/assets/v16/materials/white_plaster_02/basecolor.jpg

      - name: Refresh source files while preserving optimized assets
        run: |
          mkdir -p site/src site/dist site/docs
          cp source/index.html site/index.html
          cp source/src/styles.css site/src/styles.css
          cp source/ASSET_CREDITS.md site/ASSET_CREDITS.md
          cp source/docs/TEACHER_MOM_CHIBI_MASTER_SPEC.md site/docs/TEACHER_MOM_CHIBI_MASTER_SPEC.md
          touch site/.nojekyll

      - name: Inject V11-V16 world, palette, renderer, controls and photoreal pass
        working-directory: source
        run: |
          python3 tools/inject_premium_flowers.py src/main.js
          python3 tools/inject_dense_world_v12.py src/main.js
          python3 tools/v12_reuse_existing_assets.py src/main.js
          python3 tools/inject_cloud_forest_v13.py src/main.js
          python3 tools/refine_cloud_forest_v13.py src/main.js
          python3 tools/inject_bright_palette_v14.py src/main.js
          python3 tools/inject_aaa_clickmove_v15.py src/main.js
          python3 tools/inject_photoreal_v16.py src/main.js
          python3 tools/v15_qa_fastpath.py src/main.js
          grep -q "V11_VISUAL_POLISH" src/main.js
          grep -q "V12_DENSE_WORLD" src/main.js
          grep -q "V13_CLOUD_FOREST" src/main.js
          grep -q "V13_REFINED_FOREST" src/main.js
          grep -q "V14_BRIGHT_CANDY_PALETTE" src/main.js
          grep -q "V15_AAA_CLICKMOVE" src/main.js
          grep -q "V16_PHOTOREAL_HYBRID" src/main.js
          npx esbuild src/main.js --bundle --minify --format=iife --platform=browser --target=es2020 --outfile=../site/dist/game.min.js
          test -s ../site/dist/game.min.js

      - name: Headless 3D visual smoke QA
        working-directory: site
        run: |
          mkdir -p qa
          python3 -m http.server 8123 --bind 127.0.0.1 >/tmp/teacher-day-qa-server.log 2>&1 &
          SERVER_PID=$!
          sleep 2
          CHROME="$(command -v google-chrome || command -v chromium || true)"
          if [ -z "$CHROME" ]; then
            echo "Chrome not available on runner; route/collider QA already passed."
          else
            for STAGE in 2 4 6 9; do
              "$CHROME" --headless --no-sandbox --disable-dev-shm-usage --disable-gpu-sandbox --enable-webgl --ignore-gpu-blocklist --use-angle=swiftshader --window-size=1100,700 --virtual-time-budget=9000 --screenshot="qa/stage-${STAGE}.png" "http://127.0.0.1:8123/?qaStage=${STAGE}&qaFast=1&v=16"
              test -s "qa/stage-${STAGE}.png"
            done
          fi
          kill $SERVER_PID || true

      - name: Upload visual QA screenshots
        uses: actions/upload-artifact@v4
        with:
          name: visual-qa-v16
          path: site/qa
          if-no-files-found: warn
          retention-days: 7

      - name: Remove QA screenshots from public build
        run: rm -rf site/qa

      - name: Publish gh-pages
        working-directory: site
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to publish"
          else
            git commit -m "feat: v16 photoreal HDRI PBR hybrid"
            git push origin HEAD:gh-pages
          fi
