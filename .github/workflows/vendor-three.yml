name: Vendor Three.js locally

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/vendor-three.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  vendor:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout published branch
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          fetch-depth: 0

      - name: Download Three.js from npm and vendor it
        run: |
          npm pack three@0.168.0
          tar -xzf three-0.168.0.tgz
          mkdir -p vendor
          cp package/build/three.module.min.js vendor/three.module.min.js
          rm -rf package three-0.168.0.tgz

      - name: Switch the live site to the local Three.js copy
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          s = s.replace('  <link rel="preconnect" href="https://unpkg.com" crossorigin />\n', '')
          s = s.replace('  <link rel="modulepreload" href="https://unpkg.com/three@0.168.0/build/three.module.min.js" crossorigin />\n', '  <link rel="modulepreload" href="./vendor/three.module.min.js" />\n')
          s = s.replace('"three": "https://unpkg.com/three@0.168.0/build/three.module.min.js"', '"three": "./vendor/three.module.min.js"')
          s = s.replace('Nếu quá 10 giây, hãy tải lại trang. Mình đã chuyển sang CDN nhẹ hơn.', 'Nếu quá 5 giây, hãy tải lại trang. Bản này không còn phụ thuộc CDN 3D bên ngoài.')
          p.write_text(s, encoding='utf-8')
          PY

      - name: Commit local runtime to gh-pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add vendor/three.module.min.js index.html
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "perf: vendor Three.js locally for instant boot"
            git push origin HEAD:gh-pages
          fi
