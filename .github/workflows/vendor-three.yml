name: Verify and publish 3D journey

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: journey-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Test narrative, assets and full-body route clearance
        run: npm test
      - name: Build self-contained static site
        run: npm run build
      - name: Install browser for actual WebGL journey QA
        run: npx playwright install --with-deps chromium
      - name: Verify full journey and desktop/mobile UI
        run: npm run test:e2e
      - name: Retain screenshots for review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: journey-visual-qa
          path: test-results
          if-no-files-found: ignore
          retention-days: 7
      - name: Save verified site
        uses: actions/upload-artifact@v4
        with:
          name: verified-site
          path: site
          include-hidden-files: true
          retention-days: 7

  publish:
    if: github.event_name != 'pull_request'
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: write
    steps:
      - name: Preserve published branch history
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: published
      - uses: actions/download-artifact@v4
        with:
          name: verified-site
          path: artifact
      - name: Replace public files with the verified build
        run: rsync -a --delete --exclude='.git' artifact/ published/
      - name: Publish to the existing GitHub Pages branch
        working-directory: published
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m 'Publish verified cinematic teacher-day journey'
            git push origin HEAD:gh-pages
          fi
      # GITHUB_TOKEN branch pushes do not automatically trigger legacy Pages builds.
      - name: Explicitly request the configured GitHub Pages build
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh api --method POST "repos/$GH_REPO/pages/builds"
