name: Publish lightweight pixel-art 2D game

on:
  push:
    branches: ["main"]
    paths:
      - "index.html"
      - "src/pixel-game.js"
      - "src/fine-pixel-art.js"
      - "src/illustrated-scenes.js"
      - "assets/illustrations/**"
      - "tests/**"
      - "package*.json"
      - "playwright.config.js"
      - "tools/serve.mjs"
      - "src/config.js"
      - "src/styles.css"
      - "README.md"
      - ".github/workflows/vendor-three.yml"
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish-teacher-pixel-art
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          path: source

      - name: Checkout current Pages branch
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: site
          fetch-depth: 1

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: source/package-lock.json
      - name: Test the full illustrated journey
        working-directory: source
        run: |
          npm ci
          npx playwright install --with-deps chromium
          npm test

      - name: Validate the illustrated 15-stage story
        working-directory: source
        run: |
          node --input-type=module --check < src/config.js
          node --input-type=module --check < src/fine-pixel-art.js
          node --input-type=module --check < src/pixel-game.js
          grep -q "school-exit" src/pixel-game.js
          grep -q "car-boarding" src/pixel-game.js
          grep -q "car-driving" src/pixel-game.js
          grep -q "wish-rooftop" src/pixel-game.js
          grep -q "Tầng 3" src/config.js

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: illustrated-journey-screenshots
          path: source/test-results
          retention-days: 7
      - name: Replace 3D build with a static 2D pixel game
        if: github.event_name != 'pull_request'
        run: |
          # Remove the old photoreal models, HDRIs, minified Three.js bundle
          # and legacy screenshots from the published site.
          rm -rf site/assets site/dist site/src site/docs site/tools site/qa
          mkdir -p site/src
          cp source/index.html site/index.html
          cp source/src/config.js site/src/config.js
          cp source/src/pixel-game.js site/src/pixel-game.js
          cp source/src/fine-pixel-art.js site/src/fine-pixel-art.js
          cp source/src/styles.css site/src/styles.css
          cp source/src/illustrated-scenes.js site/src/illustrated-scenes.js
          mkdir -p site/assets
          cp -r source/assets/illustrations site/assets/illustrations
          cp source/README.md site/README.md
          touch site/.nojekyll
          test -s site/index.html
          test -s site/src/pixel-game.js
          test -s site/src/fine-pixel-art.js
          ! grep -qi 'dist/game.min.js' site/index.html
          ! grep -qi 'three' site/index.html

      - name: Publish clean pixel-art site to gh-pages
        if: github.event_name != 'pull_request'
        working-directory: site
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Pixel site is already up to date."
          else
            git commit -m "feat: publish lightweight pixel-art 20/11 journey"
            git push origin HEAD:gh-pages
          fi
