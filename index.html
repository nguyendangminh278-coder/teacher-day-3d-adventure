<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#243f38"><meta name="description" content="Một ngày 20/11 cùng mẹ: từ trường học, lên xe về nhà, lên từng tầng và khám phá cây điều ước.">
<title>Một ngày cùng mẹ · Hành trình 20/11</title>
<link rel="preload" as="font" href="./assets/fonts/BeVietnamPro-Regular.ttf" type="font/ttf" crossorigin>
<link rel="preload" as="font" href="./assets/fonts/BeVietnamPro-Bold.ttf" type="font/ttf" crossorigin>
<link rel="stylesheet" href="./src/styles.css?v=flower-intro9">
</head>
<body>
<main id="app">
<p id="sceneStatus" class="sr-only" aria-live="polite"></p>
<canvas id="game" width="1672" height="941" aria-label="Cảnh của hành trình theo thời gian, bắt đầu trên con đường hoa và mây. Dùng phím mũi tên để di chuyển và E để thực hiện hành động."></canvas>





<button id="actionBtn" class="action-btn" disabled><span id="actionLabel">Bước qua cổng trường</span><span aria-hidden="true">→</span></button>

<div id="dialogue" class="dialogue" hidden role="status"><strong id="dialogueName">Mẹ</strong><p id="dialogueText"></p></div>
<section id="classroomPanel" class="panel classroom-panel" hidden role="dialog" aria-modal="true" aria-labelledby="classTitle"><small>Những hạt mầm yêu thương</small><h2 id="classTitle">25 lời chúc từ học trò</h2><div id="classWishes" class="wish-grid"></div><button id="dismissClass" class="primary-btn">Cảm ơn các con · Mẹ ra khỏi lớp →</button></section>
<section id="finalPanel" class="panel final-panel" hidden aria-label="Cây điều ước trên tầng cao nhất"><small>Tầng 3 · Dành riêng cho mẹ</small><h2>Yêu thương mẹ gieo đã nở thành hoa.</h2><p>Chạm vào những bông hoa trên cây để đọc lời chúc.</p><p id="treeWish" class="selected-wish" aria-live="polite">Mỗi bông hoa là một điều ước.</p><button id="allWishesBtn" class="primary-btn">Đọc 24 điều ước</button><button id="replayBtn" class="text-btn">Đi lại từ con đường hoa ↻</button></section>
<section id="infoPanel" class="panel info-panel" hidden role="dialog" aria-modal="true" aria-labelledby="infoTitle"><button id="infoClose" class="info-close" aria-label="Đóng">×</button><h2 id="infoTitle"></h2><p id="infoBody"></p><button id="motionButton" class="primary-btn" hidden>Rút ngắn chuyển động</button></section>
<div id="loading" class="loading-screen" role="status"><strong>Chuẩn bị một ngày cùng mẹ…</strong><p id="loadingText">Trường học → Xe về nhà → Gia đình → Cây điều ước</p><button id="retryBtn" hidden>Tải lại</button></div>
<noscript>Hãy bật JavaScript để bắt đầu hành trình.</noscript>
</main>
<script type="module" src="./src/pixel-game.js?v=flower-intro9"></script>
</body></html>
